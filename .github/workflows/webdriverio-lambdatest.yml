name: Run WebdriverIO Tests on LambdaTest

on:
  push:
    branches: [main]

  workflow_dispatch:

jobs:
  webdriverio-test:
    runs-on: ubuntu-latest

    env:
      LT_USERNAME: ${{ secrets.LT_USERNAME }}
      LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm install

      - name: Verify Secrets
        run: |
          echo "Username length: ${#LT_USERNAME}"
          if [ -z "$LT_USERNAME" ]; then echo "LT_USERNAME missing"; exit 1; fi
          if [ -z "$LT_ACCESS_KEY" ]; then echo "LT_ACCESS_KEY missing"; exit 1; fi

      - name: Run WebdriverIO
        run: npx wdio conf/single.conf.js